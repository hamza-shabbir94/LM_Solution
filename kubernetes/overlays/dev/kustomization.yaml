apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
# The development overlay uses a different Docker image and tag, and adjusts the number of replicas for the api-service deployment.
images:
  - name: api-service
    newName: hamza94/development-api-service
    newTag: "dev-latest"

# Patches are applied to the Deployment and HorizontalPodAutoscaler resources to customize their behavior for the development environment.
patches:
  - target:
      kind: Deployment
      name: api-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
# Patches are applied to the HorizontalPodAutoscaler resource to adjust the minimum and maximum number of replicas for the api-service deployment in the development environment.
  - target:
      kind: HorizontalPodAutoscaler
      name: api-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
# Patches are applied to the PodDisruptionBudget resource to adjust the minimum number of available pods for the api-service deployment in the development environment.
  - target:
      kind: PodDisruptionBudget
      name: api-service
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
