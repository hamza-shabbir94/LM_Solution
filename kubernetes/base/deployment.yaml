apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app: api-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-service

  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   
      maxSurge: 1          

  template:
    metadata:
      labels:
        app: api-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: api-service
          image: api-service:latest   # overridden per-environment via Kustomize
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http

          # Container-level security hardening, independent of the pod-level
          # settings above -- belt and braces, and some of these (like
          # allowPrivilegeEscalation) aren't covered by runAsNonRoot alone.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          
          startupProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 10   # 2s initial + up to 10x2s = ~22s ceiling to start

          
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
