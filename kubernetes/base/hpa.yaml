# This file is part of the Kubernetes base configuration for the api-service deployment.
# It defines a HorizontalPodAutoscaler (HPA) resource that automatically scales the number of replicas of the api-service deployment based on CPU utilization.
# The HPA is configured to maintain a target CPU utilization of 70%, with a minimum of 2 replicas and a maximum of 10 replicas. This allows the deployment to scale up 
# or down based on the actual load, ensuring that the application can handle varying levels of traffic while maintaining performance and availability.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
