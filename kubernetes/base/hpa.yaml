apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale out once average CPU across pods crosses 70% of the
          # requested 50m -- leaves headroom to absorb a traffic spike
          # while new pods are still starting up.
          averageUtilization: 70
